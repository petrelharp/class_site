title: An example class site
email: instructor@uoregon.edu
description: >- # this means to ignore newlines until "baseurl:"
  This is an example site, built with jekyll.
baseurl: "/class_site" # the subpath of your site, e.g. /blog
url: "https://petrelharp.github.io" # the base hostname & protocol for your site, e.g. http://example.com
github_username:  petrelharp

# Build settings
theme: minima
plugins:
  - jekyll-feed

